[package]
name = "modelit"
version = "0.1.0"
description = "Modélisation de données Merise multiplateforme"
authors = ["Gauthier DANIELS"]
license = "GPL-3.0-or-later"
repository = "https://github.com/GauthierWebDev/modelit"
edition = "2021"

[lib]
# Nom distinct du binaire (contrainte Windows, cf. modèle officiel Tauri).
name = "modelit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1" # code généré par `generate_context!` (configuration des plugins)
tauri = { version = "2", features = ["macos-private-api"] } # fenêtres flottantes transparentes (O-45, O-46)
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "~2.7" # même mineure que @tauri-apps/plugin-opener
tauri-plugin-process = "2"
tauri-plugin-updater = "~2.13" # même mineure que @tauri-apps/plugin-updater (vérifié par `tauri build`)
