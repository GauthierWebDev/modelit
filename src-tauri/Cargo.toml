[package]
name = "modelit"
version = "0.1.0"
description = "Modélisation de données Merise multiplateforme"
authors = ["Gauthier DANIELS"]
license = "GPL-3.0-or-later"
repository = "https://github.com/GauthierWebDev/modelit"
edition = "2021"

[lib]
# Nom distinct du binaire (contrainte Windows, cf. modèle officiel Tauri).
name = "modelit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1" # code généré par `generate_context!` (configuration des plugins)
tiny_http = "0.12" # point d'écoute MCP local (O-47)
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread"] } # déjà utilisé par Tauri
tauri-plugin-deep-link = "~2.6" # liens modelit:// (O-05), même mineure que @tauri-apps/plugin-deep-link
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] } # une seule instance ; le lien va à celle qui tourne
iroh = "1.3" # sessions collaboratives : pair-à-pair chiffré, relais de secours (O-05, D3)
tauri = { version = "2", features = ["macos-private-api"] } # fenêtres flottantes transparentes (O-45, O-46)
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "~2.7" # même mineure que @tauri-apps/plugin-opener
tauri-plugin-process = "2"
tauri-plugin-updater = "~2.13" # même mineure que @tauri-apps/plugin-updater (vérifié par `tauri build`)

